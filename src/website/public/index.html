<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Screen Share</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        button {
            margin: 10px 5px;
            padding: 12px 20px;
            cursor: pointer;
        }

        input {
            padding: 12px;
            width: 250px;
        }

        video {
            width: 90%;
            max-width: 1200px;
            background: black;
            border-radius: 10px;
            margin-top: 20px;
        }

        #id {
            margin: 20px;
            padding: 10px;
            background: #222;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <h1>Screen Share</h1>

    <div>
        <strong>Seu ID:</strong>
        <span id="id">Conectando...</span>
    </div>

    <br>

    <button id="share">Compartilhar tela</button>
    <button id="stop">Parar</button>

    <br><br>

    <input
        id="peerId"
        type="text"
        placeholder="ID de quem vai receber"
    >

    <button id="connect">Enviar tela</button>

    <br>

    <video
        id="screen"
        autoplay
        playsinline
        controls
    ></video>

    <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
